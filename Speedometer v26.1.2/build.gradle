plugins {
    id 'net.fabricmc.fabric-loom' version '1.15.2'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenLocal()
    maven { url = "https://maven.fabricmc.net/" }
    mavenCentral()
    flatDir {
        dirs 'e:/Minecraft Project/DasikLibrary-Rebuilt/Archive/builds'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    implementation "net.dasik.social:dasik-library:1.9.2"

    // Compile-time interface shims required for Dasik Library 1.9.2 compile resolution
    compileOnly "net.fabricmc.fabric-api:fabric-lifecycle-events-v1:4.1.1+9d6daa9756"
    compileOnly "net.fabricmc.fabric-api:fabric-permission-api-v1:1.0.2+7c33558a56"
    testCompileOnly "net.fabricmc.fabric-api:fabric-lifecycle-events-v1:4.1.1+9d6daa9756"
    testCompileOnly "net.fabricmc.fabric-api:fabric-permission-api-v1:1.0.2+7c33558a56"

    testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

processResources {
    inputs.property "version", project.version
    inputs.property "loader_version", project.fabric_loader_version
    inputs.property "minecraft_version", project.minecraft_version
    filesMatching("fabric.mod.json") {
        expand "version": project.version,
               "loader_version": project.fabric_loader_version,
               "minecraft_version": project.minecraft_version
    }
}

loom {
    mixin {
        defaultRefmapName = "speedometer-refmap.json"
    }
}

java {
    withSourcesJar()
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

test {
    useJUnitPlatform()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

afterEvaluate {
    def targetJarTask = tasks.findByName('remapJar') ?: tasks.findByName('jar')
    if (targetJarTask != null) {
        def archiveTask = tasks.register('archiveReleaseJar') {
            group = 'build'
            description = 'Automatically copies built release JAR to central Archive Jar of all versions/MC 26.1.2, root Archive, Hub, and external vault'
            dependsOn targetJarTask
            doLast {
                def jarFile = targetJarTask.archiveFile.get().asFile
                if (!jarFile.exists()) {
                    jarFile = file("build/libs/${project.archives_base_name}-${project.mod_version}.jar")
                }
                if (jarFile.exists()) {
                    // 1. Central Outer Archive (MC 26.1.2)
                    def archiveDirs = [
                        file("../Archive Jar of all versions/MC 26.1.2"),
                        file("../../Archive Jar of all versions/MC 26.1.2")
                    ]
                    archiveDirs.each { archiveDir ->
                        if (!archiveDir.exists()) {
                            archiveDir.mkdirs()
                        }
                        copy {
                            from jarFile
                            into archiveDir
                        }
                        def sourcesJar = file("build/libs/${project.archives_base_name}-${project.mod_version}-sources.jar")
                        if (sourcesJar.exists()) {
                            copy {
                                from sourcesJar
                                into archiveDir
                            }
                        }
                        println "[AUTO-ARCHIVE] Successfully copied ${jarFile.name} to central Archive directory: ${archiveDir.canonicalPath}"
                    }

                    // 1b. Mod root Archive
                    def rootArchive = file("../Archive")
                    if (rootArchive.exists()) {
                        copy {
                            from jarFile
                            into rootArchive
                        }
                        println "[AUTO-ARCHIVE] Successfully copied ${jarFile.name} to root Archive: ${rootArchive.canonicalPath}"
                    }

                    // 2. Central Release Hub Archives
                    File hubCandidate = projectDir
                    File hubDir = null
                    while (hubCandidate != null) {
                        File checkDir = new File(hubCandidate, "minecraft-mod-release-hub")
                        if (checkDir.exists()) {
                            hubDir = checkDir
                            break
                        }
                        hubCandidate = hubCandidate.parentFile
                    }
                    if (hubDir == null) {
                        File fallback = new File("E:/Minecraft Project/minecraft-mod-release-hub")
                        if (fallback.exists()) hubDir = fallback
                    }
                    if (hubDir != null && hubDir.exists()) {
                        File targetHubDir = new File(hubDir, "archives/Speedometer")
                        targetHubDir.mkdirs()
                        copy {
                            from jarFile
                            into targetHubDir
                        }
                        println "[HUB-ARCHIVE] Copied ${jarFile.name} to release hub: ${targetHubDir.canonicalPath}"
                    }

                    // 3. External Vault Archive
                    File vaultDir = new File("D:/Minecraft Mod Archive Jars/Speedometer")
                    if (vaultDir.exists() || vaultDir.parentFile?.exists()) {
                        vaultDir.mkdirs()
                        copy {
                            from jarFile
                            into vaultDir
                        }
                        println "[VAULT-ARCHIVE] Copied ${jarFile.name} to external vault: ${vaultDir.canonicalPath}"
                    }

                    // 4. Modrinth Profile Sync
                    def profilePaths = [
                        "C:/Users/fmrif/AppData/Roaming/ModrinthApp/profiles/Fabric 26.1.2/mods",
                        "C:/Users/fmrif/AppData/Roaming/ModrinthApp/profiles/26.1.2/mods"
                    ]
                    profilePaths.each { p ->
                        def modrinthProfileMods = file(p)
                        if (modrinthProfileMods.exists()) {
                            modrinthProfileMods.listFiles().each { f ->
                                if (f.name.startsWith(project.archives_base_name) && f.name.endsWith(".jar") && f.name != jarFile.name) {
                                    f.delete()
                                    println "[MODRINTH-SYNC] Purged old version from launcher profile: ${f.name}"
                                }
                            }
                            copy {
                                from jarFile
                                into modrinthProfileMods
                            }
                            println "[MODRINTH-SYNC] Deployed ${jarFile.name} to ${p}"
                        }
                    }
                }
            }
        }
        build.finalizedBy(archiveTask)
    }
}
